<!DOCTYPE html>
<html lang="en" class="h-full bg-gray-100">
	<head>
		<meta charset="UTF-8" />
		<link rel="icon" href="/favicon.png" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Frappe Insights</title>
	</head>
	<body class="h-full">
		<div id="app" class="h-full"></div>
		<div id="modals"></div>
		<div id="popovers"></div>

		<!-- //// Neoffice — this page's build output is COMMITTED to the repo
		     //// (insights/www/insights_v2.html + insights/public/frontend/), which
		     //// upstream gitignores and rebuilds on every instance. Our 2 GB
		     //// instances OOM on that build. Keep this comment: vite copies it
		     //// verbatim, so it is the marker the committed artifact carries. -->
		<script>
			window.csrf_token = '{{ csrf_token }}'
			window.site_name = '{{ site_name }}'
		</script>
		<script type="module" src="/src/main.js"></script>
	</body>
</html>
