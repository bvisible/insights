[project]
name = "insights"
authors = [
    { name = "Powerful Reporting Tool for Frappe Apps", email = "hello@frappe.io"}
]
description = "Open Source Business Intelligence Tool"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = [
    "pandas~=2.3.3",
    "SQLAlchemy==2.0.41",
    "python-telegram-bot==21.4",
    "duckdb~=1.4.3",
    # //// Neoffice — aligned on upstream insights (version-3), which pins the same
    # //// window with the SAME ibis (`ibis-framework~=11.0.0`).
    # //// The `<28.0.0` ceiling came from upstream itself (2aec0b33, 2025-11-19) to
    # //// dodge ibis-project/ibis#11767: sqlglot 28 renamed `Star(except=…)` to
    # //// `except_`, and ibis silently dropped the EXCLUDE clause, so a `.drop()`
    # //// stopped excluding the column. That issue is CLOSED (ibis PR #11805) and
    # //// upstream replaced the ceiling with this floor.
    # ////
    # //// Why it matters here: upstream frappe pins `sql_metadata~=3.0.1`, whose
    # //// 3.x requires `sqlglot>=30.12,<31`. Held under 28, the two are mutually
    # //// unsatisfiable and the upstream-preview CI dies at import with
    # //// `No module named sqlglot.parsers` (neoffice-maintenance#261, #138).
    # //// Our own frappe pins `sql_metadata~=2.11.0`, which uses sqlparse and asks
    # //// nothing of sqlglot — so the normal CI is unaffected either way.
    "sqlglot>=30.12.0,<30.18",
    "ibis-framework~=11.0.0",
    "ibis-framework[duckdb]",
    "ibis-framework[mysql]",
    "ibis-framework[sqlite]",
    "ibis-framework[clickhouse]",
    "ibis-framework[postgres]",
    # "ibis-framework[mssql]",
    # "ibis-framework[bigquery]",
]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"


[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = [
    "F",
    "E",
    "W",
    "I",
    "UP",
    "B",
    "RUF",
]
ignore = [
    "B017", # assertRaises(Exception) - should be more specific
    "B018", # useless expression, not assigned to anything
    "B023", # function doesn't bind loop variable - will have last iteration's value
    "B904", # raise inside except without from
    "E101", # indentation contains mixed spaces and tabs
    "E402", # module level import not at top of file
    "E501", # line too long
    "E741", # ambiguous variable name
    "E731", # do not assign a lambda expression, use a def
    # "F401", # "unused" imports
    "F403", # can't detect undefined names from * import
    "F405", # can't detect undefined names from * import
    "F722", # syntax error in forward type annotation
    "W191", # indentation contains tabs
    "RUF001", # string contains ambiguous unicode character
]
typing-modules = ["frappe.types.DF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true
