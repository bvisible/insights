name: Upstream preview
# Measurement for a fork upgrade, on demand (tracker #138): the SAME tests, but the
# bench is initialised on UPSTREAM frappe/frappe + frappe/erpnext (version-15)
# instead of our forks. Failures land in a separate [CI amont] issue (key
# ci-upstream::) and never touch the normal [CI] issue of this repo.
on:
  # On demand only since 2026-11-11 (neoffice-maintenance#613). The weekly schedule measured what the pending
  # frappe/erpnext fork upgrade would cost (#138). That upgrade is done: both forks sit on the latest upstream
  # version-15, 0 commits behind. A weekly run on pure upstream can then only show the patches our forks keep
  # on purpose (an only_for that also refuses under test, a softer customer-group rule...): red every Monday by
  # construction, an issue nobody can close. Run it by hand before the next upstream merge, and read its reds
  # against the divergences we keep:  gh workflow run upstream-preview.yml -R <this repo>
  workflow_dispatch:
concurrency:
  group: upstream-preview-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ci:
    uses: bvisible/neoffice-ci/.github/workflows/frappe-app-ci.yml@main
    with:
      app: insights
      skip_build: true
      # Mirrors tests.yml. The preview must differ from the normal CI in ONE thing --
      # which frappe/erpnext it builds against -- or it measures its own gaps instead
      # of the upgrade. Without this, `bundled_asset` gets None from an unbuilt asset
      # manifest and every test that renders an email dies on
      # `'NoneType' object has no attribute 'get'` (neoffice-maintenance#261).
      build_frappe_assets: true
      upstream_preview: true
    secrets: inherit
