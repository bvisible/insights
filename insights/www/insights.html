<!DOCTYPE html>
<html lang="en" class="h-full bg-gray-100">
	<head>
		<meta charset="UTF-8" />
		<link rel="icon" href="/assets/insights/frontend/favicon.png" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Frappe Insights</title>
		<!-- //// Neoffice — the accent of frappe-ui (its blue scale) is repainted with the Neoffice signal by one sheet
		     //// that neoffice_theme serves to every Vue app. It replaces the block each app copied into src/index.css,
		     //// which set RGB triplets where frappe-ui reads colours and so never applied (measured 23.11.2026).
		     //// A script and not a <link>: the build would try to resolve a sheet another app serves. -->
		<script>
			(function () {
				var l = document.createElement("link");
				l.rel = "stylesheet";
				l.href = "/assets/neoffice_theme/css/spa_accent_v0.css";
				document.head.appendChild(l);
			})();
		</script>
		<script type="module" crossorigin src="/assets/insights/frontend/assets/main-4cd36e81.js"></script>
		<link rel="modulepreload" crossorigin href="/assets/insights/frontend/assets/frappe-ui-0add9d40.js">
		<link rel="modulepreload" crossorigin href="/assets/insights/frontend/assets/index-33c58bdf.js">
		<link rel="modulepreload" crossorigin href="/assets/insights/frontend/assets/text-cursor-input-a873ff33.js">
		<link rel="modulepreload" crossorigin href="/assets/insights/frontend/assets/combine-529ecee5.js">
		<link rel="modulepreload" crossorigin href="/assets/insights/frontend/assets/package-open-0920ea76.js">
		<link rel="modulepreload" crossorigin href="/assets/insights/frontend/assets/x-d46b7bd0.js">
		<link rel="stylesheet" href="/assets/insights/frontend/assets/frappe-ui-a638f835.css">
		<link rel="stylesheet" href="/assets/insights/frontend/assets/index-3f021ec7.css">
	</head>
	<body class="h-full">
		<div id="app" class="h-full"></div>
		<div id="modals"></div>
		<div id="popovers"></div>
		<!-- //// Neoffice — this page's build output is COMMITTED to the repo
		     //// (insights/www/insights.html + insights/public/frontend/), which
		     //// upstream gitignores and rebuilds on every instance. Our 2 GB
		     //// instances OOM on that build. Keep this comment: vite copies it
		     //// verbatim, so it is the marker the committed artifact carries. -->
		<!-- <script type="module" src="/src/main.js"></script> -->
		
	
          <script>
              {% for key in boot %}
              window["{{ key }}"] = {{ boot[key] | tojson }};
              {% endfor %}
          </script>
          </body>
          
</html>
